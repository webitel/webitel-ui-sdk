name: webitel ui-datalist pkg publish

on:
#  https://docs.github.com/en/actions/managing-workflow-runs-and-deployments/managing-workflow-runs/manually-running-a-workflow
  workflow_dispatch:

jobs:
  publish:
    permissions:
      id-token: write  # Required for OIDC, https://docs.npmjs.com/trusted-publishers#github-actions-configuration
      contents: write

    outputs:
      version: ${{ steps.publish_release.outputs.version }}

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Check release train
        # Refuses to publish a version whose YY.M train does not match the branch,
        # so a hotfix dispatched from v26.06 can never land on main's train.
        run: node scripts/check-release-train.mjs packages/ui-datalist

      - name: Publish release
        id: publish_release
        run: |
          cd packages/ui-datalist
          npm ci
          # Read the bumped version out of package.json rather than off npm's
          # stdout: that output is not reliably a bare version (a leading blank
          # line turned `VERSION=$VERSION` into two lines and GitHub rejected the
          # second one with "Invalid format").
          npm version patch --git-tag-version false >/dev/null
          version="$(jq -r .version package.json)"
          echo "VERSION=v$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          npm run lint:fix || true
          (npm run build:types || true)
          npm run lint:package
          npm run utils:publish

      # Commit all changed files back to the repository
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'ci: publish @webitel/ui-datalist ${{ env.VERSION }}'
          commit_options: '--no-verify'
